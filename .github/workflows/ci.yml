name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: StanisLoveTV
  PROJECT: StanisLoveTV.xcodeproj

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Picks the newest Xcode already installed on the runner image, so this
      # doesn't need updating every time GitHub bumps the default toolchain.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Find tvOS simulator
        id: destination
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries | sort_by(.key) | reverse[] | select(.key | contains("tvOS")) | .value[] | select(.name == "Apple TV") | .udid' \
            | head -n1)
          if [ -z "$DEVICE_UDID" ]; then
            echo "No Apple TV simulator found" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$DEVICE_UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=tvOS Simulator,id=${{ steps.destination.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
